project_id = "impulsia-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://impulsia-self.vercel.app/auth/set-password"
additional_redirect_urls = [
  "https://impulsia-self.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
